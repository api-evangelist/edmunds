description: >-
  Edmunds publishes no plans and no pricing, and says so explicitly. Its developer FAQ
  answers the question "Do you have a paid tier?" with "No, we do not have a fee-for-service
  model." The open API program was retired effective 2018-02-15 and access is now granted
  only to select strategic partners, service providers, dealers and automotive advertisers,
  brokered privately through an Edmunds Account Executive — there is no signup, no tier
  list, no quota table and no published commercial terms of any kind. plan_count is 0 because
  that is the measurement, not because the pricing page was not found.
findings:
  - question: Do you have a paid tier?
    answer: No, we do not have a fee-for-service model.
    source: https://developer.edmunds.com/faq.html
  - question: How can I establish API access?
    answer: We're not currently accepting new applicants at this time.
    source: https://developer.edmunds.com/faq.html
  - question: I'm an Edmunds dealer partner. How do I get access?
    answer: >-
      You should contact your Edmunds Account Executive and let them know you need API
      access.
    source: https://developer.edmunds.com/faq.html
access_model: partner-negotiated
