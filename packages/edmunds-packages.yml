note: >-
  Edmunds' own documentation names exactly two first-party client libraries — a JavaScript
  SDK and a Python SDK — and links both to https://github.com/EdmundsAPI/. Both of those
  linked repositories now return HTTP 404: the EdmundsAPI organisation still exists but its
  only surviving public repository is the API blog. The Python SDK survives on PyPI as a
  single 2014 release published from api@edmunds.com; nothing was ever published to npm
  under an Edmunds-owned name. This is the clearest decay signal in the record and it
  matches the retirement of the open API program on 2018-02-15 (see lifecycle/).
