other_contract_shapes_probed:
  note: >-
    Probed so the absences are measured rather than assumed. api.edmunds.com answers 403 to
    its edge for any unrouted path, so a 403 there means "no such route", not "withheld".
  probes:
    - url: https://api.edmunds.com/?wsdl
      status: 403
    - url: https://api.edmunds.com/services?wsdl
      status: 403
    - url: https://api.edmunds.com/asyncapi.yaml
      status: 403
    - url: https://api.edmunds.com/asyncapi.json
      status: 403
    - url: https://developer.edmunds.com/asyncapi.yaml
      status: 404
    - url: https://api.edmunds.com/graphql
      status: 403
    - url: https://api.edmunds.com/mcp
      status: 403
  finding: >-
    No SOAP/WSDL, no AsyncAPI, no GraphQL and no MCP surface. No .proto is published in
    either the edmunds or EdmundsAPI GitHub organisation. REST is the only contract shape
    Edmunds ships.
domain_standards:
