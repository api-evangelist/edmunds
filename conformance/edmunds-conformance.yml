    - name: ISO 3779 / NHTSA vPIC VIN decoding schema
      found: false
      note: >-
        Edmunds ships VIN decoding endpoints (api/vehicle/v1|v2/vins, squishvin) but
        publishes its own response shape; it does not declare conformance to the NHTSA vPIC
        schema or to any interchange standard for the decoded result.
  finding: >-
    None. Edmunds' automotive-retail market does have interchange standards — STAR/ADF for
    dealer lead and DMS messaging — but Edmunds' published contract declares none of them,
    and its own datasets (TMV, TCO, editorial reviews, scorecards) are proprietary by
    design. Recorded as searched-and-absent. This is reward-only in the rubric: no standard
    is asserted here because none is declared, and no penalty is implied.
