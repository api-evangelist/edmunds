apis:
- aid: edmunds:edmunds
  name: Edmunds Dealership API
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.edmunds.com/dealership_api_program.html
  properties:
  - url: https://developer.edmunds.com/dealership_api_program.html
    type: Documentation
  description: >-
    The Edmunds Dealership API is a tool that provides real-time access to data on cars for sale at dealerships
    across the country. By connecting to the API, users can search for specific makes and models, view
    pricing information, and even schedule test drives directly through the platform. This information
    is continuously updated to reflect the current inventory available at each dealership, giving users
    the most accurate and up-to-date information possible.
- aid: edmunds:edmunds
  name: Edmunds API
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.edmunds.com/api-documentation/overview/
  properties:
  - url: https://developer.edmunds.com/api-documentation/overview/
    type: Documentation
  description: >-
    Edmunds API is a robust software interface that provides access to a vast database of automotive information
    and data. With this API, users can access details on car specifications, pricing, reviews, and inventory
    from Edmunds' comprehensive database of vehicles. This API allows developers to integrate this information
    into their own applications and websites, making it easier for consumers to research and compare different
    car models.
