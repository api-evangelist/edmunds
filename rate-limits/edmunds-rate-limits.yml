specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Edmunds
providerId: edmunds
generated: '2026-09-06'
method: searched
source: >-
  https://developer.edmunds.com/api-documentation/overview/,
  https://developer.edmunds.com/faq.html,
  https://developer.edmunds.com/api-documentation/vehicle/,
  https://developer.edmunds.com/dealership_api_program.html
created: '2026-05-04'
modified: '2026-09-06'
limit_count: 0
tags:
  - Automobiles
  - Cars
  - Vehicles
  - Rate Limiting
description: >-
  Edmunds publishes no rate limits. The full developer portal was read — the API overview
  including its "Error Codes and Handling" table, the per-API overviews, the dealership
  program page and the FAQ — and none of them states a request quota, a window, a burst
  ceiling, a throttling status code or a response header. The documented error table stops
  at 400/401/403/404/502/503/504 and never mentions 429. limit_count is 0 as an honest
  measurement: whatever limits Edmunds enforces on its remaining partner keys are conveyed
  privately, not published.
limits: []
headers:
  published: false
  limit: null
  remaining: null
  reset: null
  retryAfter: null
  policy: null
  note: >-
    No RateLimit-*, X-RateLimit-* or Retry-After header is documented, and none appeared on
    live responses from api.edmunds.com on 2026-09-06. An agent has no runtime budget signal
    to read.
responseCodes:
  throttled: null
  note: 429 is absent from the published error reference.
observed:
  - url: https://api.edmunds.com/api/vehicle/v3/makes
    status: 401
    note: >-
      Unauthenticated calls are rejected before any limit applies — "Developer Inactive" —
      so no limit could be observed at runtime either.
    checked: '2026-09-06'
supersedes:
  note: >-
    This file replaces a 2026-05-04 bulk-sweep scaffold that asserted 10 req/min and 1,000
    req/month free, 100 req/min and 100,000 req/month professional, and 1,000 req/min
    enterprise limits, plus a full set of X-RateLimit-* headers. Edmunds publishes none of
    those numbers and no such headers. The scaffold was method: generated and is superseded
    here by method: searched.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
